name: cbb-evidence-demo
services:
  demo:
    build: ./demo-site
    container_name: cbb-evidence-demo
    labels:
      org.cyberblackbox.purpose: passive-demo-site
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - demo_events:/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
volumes:
  demo_events:
