name: kali-lab-stdlib-tests
on:
  push:
    paths:
      - 'lab/**'
      - 'compose.lab.yml'
      - '.github/workflows/kali-lab-tests.yml'
  pull_request:
    paths:
      - 'lab/**'
      - 'compose.lab.yml'
      - '.github/workflows/kali-lab-tests.yml'
jobs:
  lab-tests:
    name: Standalone simulated lab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s lab/tests -v
      - run: python -m compileall -q lab/controller lab/kali lab/relay
